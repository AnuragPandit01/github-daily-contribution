name: Daily Contribution

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-contribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "Anurag Pandey"
          git config user.email "${{ secrets.GH_COMMIT_EMAIL }}"

      - name: Add daily contribution
        run: |
          mkdir -p contributions
          echo "Contribution: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> contributions/activity.log

      - name: Commit and push
        run: |
          git add contributions/activity.log
          git commit -m "chore: daily contribution $(date -u '+%Y-%m-%d')"
          git push
